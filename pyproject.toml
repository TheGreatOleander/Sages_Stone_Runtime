[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sages-stone-runtime"
version = "0.1.0"
description = "Sages Stone Runtime — canonical execution engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
sages-stone = "sages_stone_runtime.cli_canonical:main"
